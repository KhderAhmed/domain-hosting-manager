services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dm-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:cached
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dm-network

  web:
    image: nginx:alpine
    container_name: dm-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - dm-network

  db:
    image: mysql:8.0
    container_name: dm-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: domain_manager
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - dm-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dm-network

  redis:
    image: redis:7-alpine
    container_name: dm-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - dm-redis-data:/data
    networks:
      - dm-network

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dm-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./:/var/www/html:cached
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dm-network

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dm-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html:cached
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dm-network

networks:
  dm-network:
    driver: bridge

volumes:
  dm-db-data:
  dm-redis-data: